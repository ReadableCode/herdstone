[project]
name = "herdstone"
version = "0.1.0"
description = "Cross-platform machine herd monitor engine"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.12",
    "paramiko>=4.0.0",
    "python-dotenv>=1.2.2",
    "textual>=8.2.8",
    "nicegui>=3.14.0",
]

[project.scripts]
herdstone = "engine.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E203"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.11",
]
